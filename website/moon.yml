language: typescript
layer: application

dependsOn:
  - angular
  - angular-plugins
  - core
  - core-plugins
  - react-lynx
  - vue-lynx
  - react
  - react-plugins
  - solid
  - solid-plugins
  - stative
  - svelte
  - svelte-plugins
  - taro
  - taro-plugins
  - vue
  - vue-plugins
  - uni-app
  - uni-app-plugins

fileGroups:
  sources:
    - docs/**/*
    - components/**/*
    - theme/**/*
    - seo/**/*
    - react-lynx/**/*
    - vue-lynx/**/*
    - uni-app/**/*
    - /scripts/prepare-angular.ts
    - /scripts/build/lynx-workspace.ts
    - /scripts/build/vue-lynx-compiler.ts
    - /scripts/build/vue.ts
    - /scripts/build/solid.ts
    - /scripts/build/vite.ts
    - /scripts/build/taro-web.ts
    - rspress.config.ts
    - env.d.ts
    - tsconfig.json
    - package.json
    - /package.json
    - /.node-version
    - /pnpm-lock.yaml
    - /pnpm-workspace.yaml
    - /tsconfig.base.json
    - /packages/*/package.json
    - /packages/*/tsconfig*.json
    - /packages/vue*/vite.config.ts
    - /packages/solid*/vite.config.ts
    - /packages/uni-app/playground/src/**/*
    - /packages/uni-app/playground/index.html
    - /packages/uni-app/playground/package.json
    - /packages/uni-app/playground/tsconfig.json
    - /packages/uni-app/playground/vite.config.js
    - /packages/*/src/**/*

tasks:
  dev:
    command: pnpm exec rspress dev --host 127.0.0.1
    preset: server
    deps: ["angular:build", "vue:build", "solid:build"]
  build:
    command: pnpm exec rspress build
    deps: ["angular:build", "vue:build", "solid:build"]
    inputs: ["@group(sources)"]
    outputs: [doc_build]
  preview:
    command: pnpm run preview
    preset: server
  typecheck:
    command: pnpm exec tsc --noEmit
    deps: ["angular:build", "vue:build", "solid:build", typecheck-react-lynx, typecheck-vue-lynx]
    inputs: ["@group(sources)"]
  typecheck-react-lynx:
    command: pnpm exec tsc --noEmit -p react-lynx/tsconfig.json
    inputs: ["@group(sources)"]
  typecheck-vue-lynx:
    command: pnpm exec tsc --noEmit -p vue-lynx/tsconfig.json
    inputs: ["@group(sources)"]
  lint:
    command: pnpm run lint
    inputs: ["@group(sources)", .oxlintrc.json, /.oxlintrc.json, /packages/react/.oxlintrc.json]
  check:
    deps: [typecheck, lint, test]
  test:
    command: pnpm run check:seo
    deps: [build]
    inputs: ["@group(sources)"]
