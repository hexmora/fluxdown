language: typescript
layer: application

dependsOn:
  - core
  - core-plugins
  - lynx
  - react
  - react-plugins
  - solid
  - solid-plugins
  - stative
  - taro
  - taro-plugins
  - vue
  - vue-plugins

fileGroups:
  sources:
    - docs/**/*
    - components/**/*
    - theme/**/*
    - lynx/**/*
    - /scripts/build/lynx-workspace.ts
    - /scripts/build/vue.ts
    - /scripts/build/solid.ts
    - /scripts/build/vite.ts
    - /scripts/build/taro-web.ts
    - rspress.config.ts
    - env.d.ts
    - tsconfig.json
    - package.json
    - /package.json
    - /.node-version
    - /pnpm-lock.yaml
    - /pnpm-workspace.yaml
    - /tsconfig.base.json
    - /packages/*/package.json
    - /packages/*/tsconfig*.json
    - /packages/vue*/vite.config.ts
    - /packages/solid*/vite.config.ts
    - /packages/*/src/**/*

tasks:
  dev:
    command: pnpm exec rspress dev --host 127.0.0.1
    preset: server
    deps: ["vue:build", "solid:build"]
  build:
    command: pnpm exec rspress build
    deps: ["vue:build", "solid:build"]
    inputs: ["@group(sources)"]
    outputs: [doc_build]
  preview:
    command: pnpm run preview
    preset: server
  typecheck:
    command: pnpm exec tsc --noEmit
    deps: ["vue:build", "solid:build", typecheck-lynx]
    inputs: ["@group(sources)"]
  typecheck-lynx:
    command: pnpm exec tsc --noEmit -p lynx/tsconfig.json
    inputs: ["@group(sources)"]
  lint:
    command: pnpm run lint
    inputs: ["@group(sources)", .oxlintrc.json, /.oxlintrc.json, /packages/react/.oxlintrc.json]
  check:
    deps: [typecheck, lint, build]
