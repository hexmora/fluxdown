language: typescript
layer: library

tasks:
  test:
    inputs:
      - vitest.config.ts
      - vitest.setup.ts
      - /scripts/build/**/*
  dev:
    command: pnpm run dev
    preset: server
  build-storybook:
    command: pnpm run build:storybook
    deps: ["^:build"]
    inputs:
      - "**/*"
      - /packages/*/src/**/*
      - /pnpm-lock.yaml
    outputs: [storybook-static, dist/preview]
