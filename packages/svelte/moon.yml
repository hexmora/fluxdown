language: typescript
layer: library

tasks:
  build:
    inputs:
      - svelte.config.js
      - vite.config.ts
  test:
    inputs:
      - vite.config.ts
      - vitest.setup.ts
  dev:
    command: pnpm run dev
    preset: server
  build-storybook:
    command: pnpm run build:storybook
    inputs:
      - "**/*"
      - /packages/*/src/**/*
      - /pnpm-lock.yaml
    outputs: [storybook-static]
