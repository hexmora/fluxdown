packages:
  - packages/*

catalogMode: strict

# moon runs tasks in parallel; dependency installation is an explicit step.
verifyDepsBeforeRun: error

catalog:
  ahooks: ^3.9.7
  classnames: ^2.5.1
  inversify: ^8.1.1
  katex: ^0.17.0
  less: ^4.9.1
  lodash-es: ^4.18.1
  marked: ^18.0.5
  "@mathjax/src": ^4.1.3
  "@mathjax/mathjax-tex-font": ^4.1.3
  mdast-util-from-markdown: ^2.0.3
  mdast-util-gfm-autolink-literal: ^2.0.1
  mdast-util-gfm-footnote: ^2.1.0
  mdast-util-gfm-strikethrough: ^2.0.0
  mdast-util-gfm-table: ^2.0.0
  mdast-util-gfm-task-list-item: ^2.0.0
  mdast-util-math: ^3.0.0
  mdast-util-to-markdown: ^2.1.2
  micromark-extension-gfm-autolink-literal: ^2.1.0
  micromark-extension-gfm-footnote: ^2.1.0
  micromark-extension-gfm-strikethrough: ^2.1.0
  micromark-extension-gfm-table: ^2.1.2
  micromark-extension-gfm-task-list-item: ^2.1.0
  micromark-extension-math: ^3.1.0
  micromark-util-character: ^2.1.1
  micromark-util-types: ^2.0.3
  react-error-boundary: ^6.1.2
  react-use: ^17.6.1
  rehype-raw: ^7.0.0
  rehype-sanitize: ^6.0.0
  remark-breaks: ^4.0.0
  remark-rehype: ^11.1.2
  rxjs: ^7.8.2
  sass: ^1.103.1
  shallow-equal: ^3.1.0
  shiki: ^4.4.2
  unified: ^11.0.5
  "@types/katex": ^0.16.8
  "@types/hast": ^3.0.4
  "@types/mathjax": ^0.0.40
  "@types/react": ^18.3.31
  "@types/react-dom": ^18.3.7
  "@types/lodash-es": ^4.17.12
  "@types/mdast": ^4.0.4
  "@types/node": ^25.9.3
  "@types/unist": ^3.0.3
  "@commitlint/cli": ^21.0.2
  "@commitlint/config-conventional": ^21.0.2
  husky: ^9.1.7
  hast-util-sanitize: ^5.0.2
  typescript: 7.0.2
  oxlint: ^1.69.0
  oxfmt: ^0.55.0
  vite: ^8.0.16
  vite-plugin-svgr: ^5.2.0
  storybook: ^10.4.4
  "@storybook/addon-docs": ^10.4.4
  "@storybook/react-vite": ^10.4.4
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  eslint-plugin-perfectionist: ^5.10.0
  remark-parse: ^11.0.0
  "@moonrepo/cli": 2.5.4
  "@rslib/core": 1.0.0
  "@rsbuild/core": 2.2.3
  "@rsbuild/plugin-react": 2.1.0
  "@rsbuild/plugin-sass": 2.0.1
  "@rsbuild/plugin-less": 2.0.1
  "@rsbuild/plugin-svgr": 2.0.5
  "jest": 30.5.1
  "jest-environment-jsdom": 30.5.1
  "@swc/jest": 0.2.39
  "@swc/core": 1.16.2
  "@types/jest": 30.0.0
  "expect-type": 1.4.0
  "@changesets/cli": 3.0.2
  "@changesets/parse": 1.0.0
  "@changesets/read": 1.0.1
  "semver": 7.8.5
  "@types/semver": 7.8.0
  tsx: 4.23.13
  yaml: 2.9.0

  "@svgr/core": 8.1.0
  "@svgr/plugin-jsx": 8.1.0

catalogs:
  web:
    react: 18.3.1
    react-dom: 18.3.1
  native:
    react: 19.2.3
    react-dom: 19.2.3
    react-native: 0.86.3
    react-native-svg: 15.15.4
    "@types/react": ^19.2.18
    react-test-renderer: 19.2.3
    "@testing-library/react-native": 13.3.3
    react-native-builder-bob: 0.43.2
    expo: ~57.0.28
    babel-preset-expo: ~57.0.1
    "@react-native/babel-preset": 0.86.3
    "@react-native/jest-preset": 0.86.3
    babel-jest: 30.5.1
    "@storybook/react-native": 10.4.4
    "@storybook/addon-ondevice-controls": 10.4.4
    "@storybook/addon-ondevice-actions": 10.4.4
    "@gorhom/bottom-sheet": ^5.2.8
    react-native-gesture-handler: ~2.32.0
    react-native-reanimated: 4.5.1
    react-native-worklets: 0.10.1
    react-native-safe-area-context: ~5.7.0
    react-native-web: ~0.21.0
  react-peer:
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0

packageExtensions:
  # Keep React 18 web declarations separate from React 19 native declarations.
  react-error-boundary@6:
    peerDependencies:
      "@types/react": ^18.0.0 || ^19.0.0
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # Perfectionist and its typescript-eslint utilities still use the legacy
  # compiler API. Scope the official compatibility package to this lint plugin;
  # workspace typechecks and Rslib declaration builds use TypeScript 7.
  eslint-plugin-perfectionist@5:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
  storybook@*:
    dependencies:
      "@storybook/react-vite": ^10.4.4

overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  "@storybook/react-native-ui": 10.4.4
  "@storybook/react-native-ui-common": 10.4.4
  "@storybook/react": 10.4.4
  "@storybook/react-dom-shim": 10.4.4
  "@fluxdown/react-native>@types/react": "catalog:native"
  "@fluxdown/react-native-presets>@types/react": "catalog:native"
  "react-native>@types/react": "catalog:native"

allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true
