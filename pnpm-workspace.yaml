catalogs:
  solid-peer:
    solid-js: ^1.9.0
  taro-peer:
    "@tarojs/components": ^4.3.1
    "@tarojs/taro": ^4.3.1
  taro-react:
    react: 18.3.1
    react-dom: 18.3.1
  vue-peer:
    vue: ^3.5.0
  svelte:
    typescript: npm:@typescript/typescript6@6.0.2
  svelte-peer:
    svelte: ^5.46.4
  react-native-peer:
    react: ^19.0.0
    react-native: ">=0.83.0 <1"
  lynx-peer:
    "@lynx-js/react": ^0.129.0
    "@lynx-js/types": ^4.3.0
  react-peer:
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0

packageExtensions:
  # Perfectionist and its typescript-eslint utilities still use the legacy
  # compiler API. Scope the official compatibility package to this lint plugin;
  # workspace typechecks and Rslib declaration builds use TypeScript 7.
  eslint-plugin-perfectionist@5:
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
  storybook@*:
    dependencies:
      "@storybook/react-vite": ^10.4.4

overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"

allowBuilds:
  svelte-preprocess: false
  "@swc/core": true
  "@parcel/watcher": true
  core-js: false
  esbuild: true
  unrs-resolver: true
  "@tarojs/binding": true
  "@tarojs/cli": false
  core-js-pure: false
